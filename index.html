<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>راند</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="راند">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;
 --brand:#0f766e;--soft:#ccfbf1;--danger:#dc2626;--ok:#059669;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151b23;--ink:#e8eaed;--muted:#9aa4b2;
 --line:#232c38;--brand:#2dd4bf;--soft:#0d3b36}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;padding-bottom:76px;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Vazirmatn,Tahoma,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
 padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;font-weight:700}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:7px 11px;font:inherit;font-size:14px}
main{padding:12px 14px;max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:11px}
.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.grow{flex:1}
label{display:block;font-size:12.5px;color:var(--muted);margin:9px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;
 background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:70px;resize:vertical;line-height:1.75}
button{cursor:pointer}
.btn{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:7px 11px;font-size:13.5px;font-weight:500}
.btn.dim{background:var(--line);color:var(--ink)}
.btn:disabled{opacity:.5}
nav{position:fixed;bottom:0;inset-inline:0;z-index:20;display:flex;background:var(--card);
 border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:0;border:0;padding:9px 2px 7px;color:var(--muted);font:inherit;font-size:11px;display:grid;gap:2px;justify-items:center}
nav button.on{color:var(--brand);font-weight:700}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- دستیار ---- */
.bigmic{width:118px;height:118px;border-radius:50%;border:0;background:var(--brand);color:#fff;
 font-size:46px;display:grid;place-items:center;margin:14px auto;box-shadow:0 8px 28px rgba(15,118,110,.32)}
.bigmic.rec{background:var(--danger);animation:pulse 1.15s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 24px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.hint{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 6px}
.ex{background:var(--bg);border:1px dashed var(--line);border-radius:11px;padding:10px 12px;
 font-size:13px;color:var(--muted);line-height:2}
.log{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.log:last-child{border:0}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--brand);flex:none;margin-top:3px}
.pill.red{background:#fee2e2;color:#b91c1c}.pill.amber{background:#fef3c7;color:#92400e}
.pill.gray{background:var(--line);color:var(--muted)}.pill.green{background:#d1fae5;color:#047857}
@media (prefers-color-scheme:dark){.pill.red{background:#3f1d1d}.pill.amber{background:#3d2e10}.pill.green{background:#06352a}}

/* ---- جدول ---- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:600px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.b{font-weight:800;color:var(--brand);font-size:15px;white-space:nowrap}
.mini{color:var(--muted);font-size:12px;display:block}
.todo{color:#92400e}.todo:before{content:"○ "}
@media (prefers-color-scheme:dark){.todo{color:#fcd34d}}
.doneline{text-decoration:line-through;color:var(--muted)}

.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.chk input{width:21px;height:21px;flex:none;margin-top:2px;accent-color:var(--brand)}
.chk .x{background:0;border:0;color:var(--muted);font-size:19px;padding:0 5px;line-height:1}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;align-items:end}
.sheet{background:var(--card);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;
 padding:16px 15px calc(env(safe-area-inset-bottom) + 16px)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px;max-width:640px;margin:auto;width:94%}}
.warnbox{background:#fef3c7;color:#78350f;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.7}
@media (prefers-color-scheme:dark){.warnbox{background:#3d2e10;color:#fde68a}}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;
 border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:30px 14px;font-size:14px}
.muted{color:var(--muted);font-size:13px}
h3{font-size:14.5px;margin:0 0 9px}
hr{border:0;border-top:1px solid var(--line);margin:13px 0}
.ddx{border-inline-start:3px solid var(--line);padding-inline-start:10px;margin-bottom:11px}
.ddx.cm{border-color:var(--danger)}.ddx.lk{border-color:var(--ok)}.ddx.nx{border-color:var(--brand)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:11px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--brand);font-weight:800}
.stat small{color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <button id="back" style="display:none">‹</button>
  <h1 id="title">راند</h1>
  <button id="act" style="display:none">⋯</button>
</header>
<main id="view"></main>
<nav id="nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
/* ═══ داده — فقط روی همین دستگاه ═══ */
const KEY='rand_v3';
const DEF={beds:[],log:[],procs:[],settings:{baseUrl:'https://api.gapgpt.app/v1',
  model:'gemini-2.5-flash-lite',apiKey:'',sttModel:'whisper-1'}};
let S=load();
function load(){try{return Object.assign({},structuredClone(DEF),JSON.parse(localStorage.getItem(KEY)||'{}'))}
  catch(e){return structuredClone(DEF)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toLocaleString('fa-IR',{hour:'2-digit',minute:'2-digit'});
const today=()=>new Date().toLocaleDateString('fa-IR');

/* ارقام فارسی/عربی → انگلیسی، تا «تخت ۱۲» و «تخت 12» یکی شوند */
const fixNum=s=>String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                             .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function bedOf(n,make){
  n=fixNum(n).trim(); if(!n)return null;
  let b=S.beds.find(x=>x.bed===n);
  if(!b&&make){b={id:uid(),bed:n,items:[],created:today()};S.beds.push(b);
    S.beds.sort((a,c)=>(parseInt(a.bed)||999)-(parseInt(c.bed)||999))}
  return b;
}
function ageText(b){
  if(b.ageM==null||b.ageM==='')return '';
  const m=+b.ageM; if(m<1)return 'نوزاد'; if(m<24)return m+' ماهه';
  const y=Math.floor(m/12),r=m%12; return y+' ساله'+(r?' و '+r+' ماه':'');
}
function vitalRange(m){for(const[l,v]of[[1,{hr:'100-205',rr:'30-60',sbp:'>60'}],[12,{hr:'100-190',rr:'30-53',sbp:'>70'}],
  [24,{hr:'98-140',rr:'22-37',sbp:'>72'}],[60,{hr:'80-120',rr:'20-28',sbp:'>76'}],
  [144,{hr:'75-118',rr:'18-25',sbp:'>82'}],[999,{hr:'60-100',rr:'12-20',sbp:'>90'}]])if(m<l)return v}

/* items: {id,kind,text,done,date}  kind = task | result | note | dx */
const KINDS={task:['کار','amber'],result:['جواب','green'],note:['یادداشت','gray'],dx:['تشخیص','']};
const openTasks=b=>(b.items||[]).filter(i=>i.kind==='task'&&!i.done);
const lastOf=(b,k)=>(b.items||[]).filter(i=>i.kind===k).slice(-1)[0];

/* ═══ ناوبری ═══ */
let TAB='ask', OPEN=null;
document.getElementById('nav').innerHTML=[
 ['ask','دستیار','M12 3a3 3 0 00-3 3v5a3 3 0 006 0V6a3 3 0 00-3-3zM5 11a7 7 0 0014 0M12 18v3'],
 ['tbl','جدول','M3 5h18M3 12h18M3 19h18M9 5v14'],
 ['stat','آمار','M4 20V10M10 20V4M16 20v-7M22 20H2'],
 ['set','تنظیمات','M12 15a3 3 0 100-6 3 3 0 000 6zM19 12l2 1-2 4-2-1-3 2v2H10v-2l-3-2-2 1-2-4 2-1-2-1 2-4 2 1 3-2V2h4v2l3 2 2-1 2 4-2 1z']]
 .map(([k,l,d])=>`<button data-t="${k}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${l}</button>`).join('');
document.getElementById('nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b){OPEN=null;TAB=b.dataset.t;render()}};
document.getElementById('back').onclick=()=>{OPEN=null;render()};

function render(){
  const V=document.getElementById('view'),T=document.getElementById('title'),
        B=document.getElementById('back'),A=document.getElementById('act');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB&&!OPEN));
  B.style.display=OPEN?'':'none'; A.style.display='none';
  if(OPEN){const b=S.beds.find(x=>x.id===OPEN); if(!b){OPEN=null;return render()}
    T.textContent='تخت '+b.bed; A.style.display=''; A.onclick=()=>bedMenu(b);
    V.innerHTML=bedView(b); bindBed(b); window.scrollTo(0,0); return}
  if(TAB==='ask'){T.textContent='راند';V.innerHTML=askView();bindAsk()}
  if(TAB==='tbl'){T.textContent='جدول راند';V.innerHTML=tblView();}
  if(TAB==='stat'){T.textContent='آمار من';V.innerHTML=statView();bindStat()}
  if(TAB==='set'){T.textContent='تنظیمات';V.innerHTML=setView();bindSet()}
  window.scrollTo(0,0);
}

/* ═══ صفحه‌ی دستیار ═══ */
function askView(){
  return `<div class="card" style="text-align:center">
    <button class="bigmic" id="mic">🎤</button>
    <p class="hint" id="hint">بزن و حرف بزن — یا پایین تایپ کن</p>
    <div class="row"><textarea id="txt" class="grow" placeholder="مثلاً: تخت ۱۲ سی‌بی‌سی و سی‌آرپی فرستادیم، تبش ۳۹ بود"></textarea></div>
    <button class="btn" id="go" style="width:100%;margin-top:9px">ثبت کن</button>
    <p class="muted" style="margin:7px 0 0;font-size:12px">آیفون دیکته‌ی درون‌برنامه‌ای نمی‌دهد؛ 🎤 کیبورد خودش همان کار را می‌کند و فارسی را بهتر می‌گیرد.</p>
    <div id="out" class="muted" style="margin-top:9px"></div></div>
  <div class="card"><h3>چی می‌توانی بگویی</h3><div class="ex">
    «تخت ۱۲، پسر ۲۰ ماهه، ۱۱ کیلو، تشنج تب‌دار»<br>
    «برای تخت ۱۲ سی‌بی‌سی و سی‌آرپی بفرست»<br>
    «تخت ۱۲ سی‌بی‌سی‌اش آمد، WBC چهارده»<br>
    «تخت ۷ رو انجام دادم» · «تخت ۷ ال‌پی شد»<br>
    «تخت ۹ رو ترخیص کن»</div></div>
  <div class="card"><h3>امروز چه کردی</h3>
    ${S.log.length?S.log.slice(0,25).map(l=>`<div class="log">
      <span class="pill ${l.c||''}">${esc(l.t)}</span>
      <div class="grow"><div>${esc(l.x)}</div><small class="muted">${esc(l.at)}</small></div></div>`).join('')
     :'<div class="empty">هنوز چیزی ثبت نکرده‌ای.</div>'}</div>`;
}
function bindAsk(){
  const $=i=>document.getElementById(i);
  if(isIOS&&standalone)$('hint').innerHTML='بزن، بعد <b>🎤 کیبورد</b> را بگیر و حرف بزن';
  $('mic').onclick=()=>listen($('mic'),$('hint'),t=>{$('txt').value=(($('txt').value+' '+t).trim());$('go').click()});
  $('go').onclick=()=>submit($('txt').value.trim());
}
function logit(t,x,c){S.log.unshift({t,x,c,at:now()}); S.log=S.log.slice(0,300)}

/* ═══ فهم جمله ═══ */
async function submit(text){
  if(!text)return;
  const $=i=>document.getElementById(i), o=$('out');
  o.innerHTML='<span class="spin"></span> در حال فهمیدن…'; $('go').disabled=true;
  try{
    const acts = S.settings.apiKey ? await parseAI(text) : parseLocal(text);
    if(!acts.length){o.textContent='نفهمیدم به کدام تخت مربوط است. اولش بگو «تخت ۱۲…».';$('go').disabled=false;return}
    apply(acts); $('txt').value=''; save(); render();
  }catch(e){ o.innerHTML='❌ '+esc(e.message)+'<br><span class="muted">به‌جایش خام ثبت شد.</span>';
    const f=parseLocal(text); if(f.length){apply(f);$('txt').value='';save();setTimeout(render,1400)} else $('go').disabled=false }
}

/* پارسر آفلاین — وقتی کلید نیست یا سرویس جواب نداد */
function parseLocal(text){
  const t=fixNum(text);
  const m=t.match(/تخت\s*([0-9]+)/); if(!m)return [];
  const rest=t.slice(m.index+m[0].length).replace(/^[\s,،.:؛-]+/,'').trim();
  if(!rest)return [];
  if(/ترخیص/.test(rest))return [{bed:m[1],kind:'discharge'}];
  if(/انجام شد|انجام دادم|شد$|زدیم|گرفتیم/.test(rest))return [{bed:m[1],kind:'done',text:rest}];
  if(/بفرست|بگیر|درخواست|اوردر|چک کن/.test(rest))return [{bed:m[1],kind:'task',text:rest}];
  if(/جواب|آمد|اومد|نتیجه/.test(rest))return [{bed:m[1],kind:'result',text:rest}];
  return [{bed:m[1],kind:'note',text:rest}];
}

async function parseAI(text){
  const beds=S.beds.map(b=>b.bed).join('، ')||'—';
  const t=await ai([{role:'system',content:
`تو دستیار یک اینترن بخش اطفال هستی. جمله‌ی گفتاری او را به فهرست عمل تبدیل کن. فقط JSON برگردان:
{"actions":[{"bed":"12","kind":"...","text":"...","ageM":20,"wt":11.5,"sex":"m","dx":"..."}]}
kind یکی از این‌هاست:
- "task"   کاری که باید انجام شود (اوردر، آزمایش، درخواست مشاوره). برای هر آزمایش یک action جدا بساز.
- "result" جواب آزمایش یا یافته‌ای که آمده.
- "done"   کاری که انجام شده — متنش را بنویس تا کار باز متناظر تیک بخورد.
- "note"   هر چیز دیگر (سیر بیمار، علامت، تصمیم).
- "info"   مشخصات بیمار؛ ageM (سن به ماه)، wt (وزن kg)، sex (m/f)، dx (تشخیص) را پر کن.
- "discharge" ترخیص.
- "ddx"    وقتی صریحاً تشخیص افتراقی خواست.
تخت‌های موجود: ${beds}. شماره‌ی تخت را با رقم انگلیسی بده. متن را کوتاه و تمیز بنویس، بدون «تخت N».
اگر شماره‌ی تخت گفته نشد، actions را خالی بگذار.`},
    {role:'user',content:text}],true);
  const d=parseJSON(t);
  return (d.actions||[]).filter(a=>a&&a.bed!=null).map(a=>({...a,bed:fixNum(a.bed)}));
}

function apply(acts){
  for(const a of acts){
    const b=bedOf(a.bed,true); if(!b)continue;
    const txt=(a.text||'').trim();
    if(a.kind==='info'){
      if(a.ageM!=null)b.ageM=+a.ageM; if(a.wt!=null)b.wt=+a.wt;
      if(a.sex)b.sex=a.sex; if(a.dx)b.dx=a.dx;
      logit('تخت '+b.bed,'مشخصات ثبت شد'+(a.dx?' — '+a.dx:''),''); continue}
    if(a.kind==='discharge'){b.out=true;logit('تخت '+b.bed,'ترخیص شد','gray');continue}
    if(a.kind==='ddx'){logit('تخت '+b.bed,'درخواست تشخیص افتراقی','');setTimeout(()=>makeDDx(b.id),350);continue}
    if(a.kind==='done'){
      const open=openTasks(b);
      const hit=open.find(i=>near(i.text,txt))||open[0];
      if(hit){hit.done=true;hit.doneAt=now();logit('تخت '+b.bed,'✔ '+hit.text,'green')}
      else{b.items.push({id:uid(),kind:'note',text:txt,date:now()});logit('تخت '+b.bed,txt,'gray')}
      continue}
    const kind=['task','result','note'].includes(a.kind)?a.kind:'note';
    if(!txt)continue;
    b.items.push({id:uid(),kind,text:txt,done:false,date:now()});
    logit('تخت '+b.bed,txt,KINDS[kind][1]);
  }
}
/* تطبیق تقریبی متن «انجام شد» با کار باز */
function near(a,b){
  const n=s=>fixNum(s).toLowerCase().replace(/[^\wآ-ی ]/g,' ').split(/\s+/).filter(w=>w.length>1);
  const A=n(a),B=n(b); if(!A.length||!B.length)return false;
  return A.some(w=>B.includes(w));
}

/* ═══ جدول ═══ */
function tblView(){
  const act=S.beds.filter(b=>!b.out);
  if(!act.length)return '<div class="empty">هنوز تختی ثبت نشده.<br>برو به دستیار و بگو «تخت ۱۲…».</div>';
  return `<div class="tw"><table><thead><tr>
      <th>تخت</th><th>بیمار</th><th>کارهای مانده</th><th>آخرین جواب</th><th>آخرین نکته</th></tr></thead><tbody>
    ${act.map(b=>{const r=lastOf(b,'result'),n=lastOf(b,'note'),o=openTasks(b);
      return `<tr onclick="OPEN='${b.id}';render()">
        <td class="b">${esc(b.bed)}</td>
        <td>${esc(b.dx||'—')}<span class="mini">${esc(ageText(b))}${b.wt?' · '+b.wt+'kg':''}</span></td>
        <td>${o.length?o.map(i=>`<div class="todo">${esc(i.text)}</div>`).join(''):'<span class="mini">—</span>'}</td>
        <td>${r?esc(r.text)+`<span class="mini">${esc(r.date)}</span>`:'<span class="mini">—</span>'}</td>
        <td>${n?esc(n.text)+`<span class="mini">${esc(n.date)}</span>`:'<span class="mini">—</span>'}</td></tr>`}).join('')}
    </tbody></table></div>
  <p class="muted" style="text-align:center">روی هر سطر بزن تا کامل ببینی · جدول را بکش تا ستون‌های بعدی بیاید</p>
  ${S.beds.some(b=>b.out)?`<div class="card"><h3>ترخیص‌شده‌ها</h3>${S.beds.filter(b=>b.out).map(b=>

/* ═══ AI ═══ */
async function ai(messages,json){
  const s=S.settings;
  if(!s.apiKey)throw new Error('اول کلید API را در تنظیمات وارد کن.');
  const r=await fetch(s.baseUrl+'/chat/completions',{method:'POST',
    headers:{'Authorization':'Bearer '+s.apiKey,'Content-Type':'application/json'},
    body:JSON.stringify({model:s.model,messages,temperature:0.1,...(json?{response_format:{type:'json_object'}}:{})})});
  if(!r.ok){
    let why=''; try{const j=await r.json(); why=j?.error?.message||j?.message||JSON.stringify(j).slice(0,160)}
    catch(e){try{why=(await r.text()).slice(0,160)}catch(e2){}}
    if(r.status===401)throw new Error('کلید قبول نشد (۴۰۱). '+(why||'کلید را در پنل GapGPT چک کن — شاید باطل شده یا اعتبارش تمام شده.'));
    if(r.status===404)throw new Error('آدرس یا اسم مدل پیدا نشد (۴۰۴). '+why);
    if(r.status===429)throw new Error('سقف مصرف پر شده (۴۲۹). '+why);
    throw new Error('سرویس جواب نداد ('+r.status+')'+(why?' — '+why:''));
  }
  const d=await r.json();
  const c=d?.choices?.[0]?.message?.content; if(!c)throw new Error('پاسخ خالی بود.');
  return c;
}
function parseJSON(t){const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('پاسخ ساختار درستی نداشت.');return JSON.parse(m[0])}

function brief(b){
  const L=[];
  L.push([ageText(b),b.sex?(b.sex==='f'?'دختر':'پسر'):'',b.wt?`وزن ${b.wt} کیلوگرم`:''].filter(Boolean).join('، ')||'کودک');
  if(b.dx)L.push('تشخیص کاری: '+b.dx);
  const g=k=>(b.items||[]).filter(i=>i.kind===k).map(i=>i.text);
  if(g('result').length)L.push('یافته‌ها و جواب‌ها: '+g('result').join(' / '));
  if(g('note').length)L.push('سیر: '+g('note').join(' / '));
  const t=(b.items||[]).filter(i=>i.kind==='task');
  if(t.length)L.push('اقدامات: '+t.map(i=>i.text+(i.done?' (انجام شد)':' (مانده)')).join(' / '));
  return scrub(L.join('\n'));
}
const scrub=t=>t.replace(/\b\d{10}\b/g,'[حذف‌شده]').replace(/\b09\d{9}\b/g,'[حذف‌شده]')
                .replace(/پرونده\s*:?\s*\d+/g,'[حذف‌شده]');

function buildPPT(d){

  s.addText(d.subtitle||'',{x:.6,y:3.05,w:8.8,h:.6,fontSize:17,color:'475569',fontFace:F,align:'right',rtlMode:true});
  (d.slides||[]).forEach(sl=>{const t=P.addSlide();
    t.addText(sl.h||'',{x:.5,y:.35,w:9,h:.75,fontSize:25,bold:true,color:T,fontFace:F,align:'right',rtlMode:true});
    t.addShape(P.ShapeType.rect,{x:.5,y:1.12,w:9,h:.035,fill:{color:T}});
    t.addText((sl.b||[]).map(x=>({text:String(x),options:{bullet:{code:'25CF'},breakLine:true}})),
      {x:.6,y:1.4,w:8.8,h:3.8,fontSize:17,color:'1F2937',fontFace:F,align:'right',rtlMode:true,lineSpacingMultiple:1.35})});
  P.addSlide().addText('این دک با کمک هوش مصنوعی تهیه شده و پیش از ارائه باید بازبینی شود.',
    {x:.6,y:2.4,w:8.8,h:1,fontSize:15,color:'92400E',fontFace:F,align:'center',rtlMode:true});
  const name=(d.title||'case').replace(/[\\/:*?"<>|]/g,'-').slice(0,40)+'.pptx';
  P.write({outputType:'blob'}).then(async blob=>{
    const f=new File([blob],name,{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:name});toast('آماده شد ✔');return}catch(e){if(e.name==='AbortError')return}}
    dl(blob,name);toast('فایل ذخیره شد ✔')});
}

function copyReport(id){
  const b=S.beds.find(x=>x.id===id);
  let t=`تخت ${b.bed}\n${[ageText(b),b.sex?(b.sex==='f'?'دختر':'پسر'):'',b.wt?b.wt+' kg':''].filter(Boolean).join('، ')}\nتشخیص: ${b.dx||'—'}\n\n`;
  const g=(k,l)=>{const a=(b.items||[]).filter(i=>i.kind===k);
    if(a.length)t+=l+':\n'+a.map(i=>`- ${i.text}${i.kind==='task'?(i.done?' (انجام شد)':' (مانده)'):''} [${i.date}]`).join('\n')+'\n\n'};
  g('note','سیر بیمار');g('result','جواب‌ها و یافته‌ها');g('task','اقدامات');
  navigator.clipboard.writeText(t).then(()=>{closeSheet();toast('گزارش کپی شد')},()=>alert(t));
}

/* ═══ ضبط صدا و تبدیل به متن روی سرویس ═══ */
/* این راه محدودیت iOS را دور می‌زند: ضبط اجازه دارد، فقط دیکته‌ی درون‌مرورگر ممنوع است. */
let MR=null;
function pickMime(){
  for(const m of ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'])
    if(window.MediaRecorder?.isTypeSupported?.(m))return m;
  return '';
}
async function startRec(){
  const st=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=pickMime();
  const mr=new MediaRecorder(st,mt?{mimeType:mt}:undefined);
  const chunks=[];
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const stopped=new Promise(res=>mr.onstop=()=>{
    st.getTracks().forEach(t=>t.stop());
    res(new Blob(chunks,{type:mt||'audio/mp4'}))});
  mr.start(); MR=mr;
  return {stop:()=>{if(mr.state!=='inactive')mr.stop();MR=null;return stopped}};
}
async function recordFor(ms){const r=await startRec();await new Promise(x=>setTimeout(x,ms));return r.stop()}

async function transcribe(blob){
  const s=S.settings;
  if(!s.apiKey)throw new Error('اول کلید API را وارد کن.');
  if(blob.size<1200)throw new Error('چیزی ضبط نشد.');
  const ext=(blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm');
  const fd=new FormData();
  fd.append('file',new File([blob],'a.'+ext,{type:blob.type}));
  fd.append('model',s.sttModel);
  fd.append('language','fa');
  const r=await fetch(s.baseUrl+'/audio/transcriptions',{method:'POST',
    headers:{'Authorization':'Bearer '+s.apiKey},body:fd});
  if(!r.ok){
    let why='';try{const j=await r.json();why=j?.error?.message||''}catch(e){}
    if(r.status===404)throw new Error('این سرویس مدل «'+s.sttModel+'» را ندارد. '+why);
    if(r.status===401)throw new Error('کلید قبول نشد (۴۰۱). '+why);
    throw new Error('تبدیل صدا نشد ('+r.status+')'+(why?' — '+why:''));
  }
  const d=await r.json().catch(()=>null);
  return (d?.text||'').trim();
}

/* ═══ صدا ═══ */
/* روی آیفون، دیکته‌ی وب در حالت نصب‌شده اغلب اجازه نمی‌گیرد.
   پس اول صریح اجازه می‌گیریم، و اگر نشد به دیکته‌ی کیبورد خود iOS پاس می‌دهیم. */
let REC=null;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||
  (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=window.navigator.standalone===true||
  matchMedia('(display-mode: standalone)').matches;

function useKeyboard(hint,why){
  const t=document.getElementById('txt');
  hint.innerHTML=(why?esc(why)+'<br>':'')+'<b>🎤 کیبورد را بگیر و حرف بزن</b>';
  if(t){t.focus();t.scrollIntoView({block:'center',behavior:'smooth'})}
}

async function listen(btn,hint,cb){
  /* راه اول: ضبط و فرستادن به سرویس — همه‌جا کار می‌کند، آیفون هم */
  if(S.settings.sttModel&&S.settings.apiKey&&window.MediaRecorder)return recFlow(btn,hint,cb);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  /* iOS در حالت نصب‌شده دیکته‌ی وب را رد می‌کند (service-not-allowed).
     پس وقت کاربر را تلف نکن و مستقیم به دیکته‌ی کیبورد ببر. */
  if(isIOS&&standalone)return useKeyboard(hint,'');
  if(!SR)return useKeyboard(hint,'این مرورگر دیکته‌ی خودکار ندارد.');
  if(REC){REC.stop();REC=null;return}

  /* اجازه‌ی میکروفون را صریح بگیر تا iOS پرامپت را نشان دهد */
  if(navigator.mediaDevices?.getUserMedia){
    hint.textContent='اجازه‌ی میکروفون…';
    try{ const st=await navigator.mediaDevices.getUserMedia({audio:true});
         st.getTracks().forEach(t=>t.stop()) }
    catch(e){
      return useKeyboard(hint, standalone&&isIOS
        ? 'iOS در حالت نصب‌شده اجازه‌ی میکروفون نداد.'
        : 'اجازه‌ی میکروفون داده نشد. (Settings ← Safari ← Microphone)');
    }
  }

  const r=new SR();REC=r;r.lang='fa-IR';r.interimResults=true;r.continuous=false;
  btn.classList.add('rec');hint.textContent='بگو…';
  let fin='',failed=false;
  r.onresult=e=>{let iv='';for(const x of e.results)x.isFinal?fin+=x[0].transcript:iv+=x[0].transcript;
    hint.textContent=(fin+iv).slice(-70)||'بگو…'};
  r.onerror=e=>{failed=true;
    if(e.error==='not-allowed'||e.error==='service-not-allowed')
      useKeyboard(hint,'iOS اجازه‌ی دیکته‌ی درون‌برنامه‌ای را نداد.');
    else if(e.error==='no-speech')hint.textContent='چیزی نشنیدم، دوباره بزن';
    else if(e.error==='network')useKeyboard(hint,'دیکته‌ی آنلاین در دسترس نیست.');
    else hint.textContent='صدا گرفته نشد ('+e.error+')';
    btn.classList.remove('rec')};
  r.onend=()=>{btn.classList.remove('rec');REC=null;
    if(fin.trim()){hint.textContent='بزن و حرف بزن — یا پایین تایپ کن';cb(fin.trim())}
    else if(!failed)hint.textContent='چیزی نشنیدم، دوباره بزن'};
  try{r.start()}catch(e){useKeyboard(hint,'دیکته شروع نشد.')}
}

let RECH=null;
async function recFlow(btn,hint,cb){
  if(RECH){ // تپ دوم = پایان ضبط
    const h=RECH;RECH=null;btn.classList.remove('rec');hint.innerHTML='<span class="spin"></span> در حال نوشتن…';
    try{const t=await transcribe(await h.stop());
      hint.textContent='بزن و حرف بزن — یا پایین تایپ کن';
      if(t)cb(t); else hint.textContent='چیزی نشنیدم، دوباره بزن'}
    catch(e){useKeyboard(hint,e.message)}
    return}
  try{ RECH=await startRec(); btn.classList.add('rec');
       hint.innerHTML='<b>در حال ضبط…</b> وقتی تمام شد دوباره بزن' }
  catch(e){ RECH=null; useKeyboard(hint,'میکروفون اجازه نداد.') }
}

/* ═══ UI ═══ */
function sheet(h){closeSheet();const d=document.createElement('div');d.className='modal';d.id='modal';
  d.innerHTML='<div class="sheet">'+h+'</div>';d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d)}
function closeSheet(){const m=document.getElementById('modal');if(m)m.remove()}
function toast(t){const e=document.createElement('div');
  e.style.cssText='position:fixed;bottom:88px;inset-inline:0;margin:auto;width:max-content;max-width:88%;z-index:99;background:#111827;color:#fff;padding:10px 17px;border-radius:999px;font-size:14px';
  e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

render();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update();
    setInterval(()=>reg.update(),60*60*1000);
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing; if(!w)return;
      w.addEventListener('statechange',()=>{
        if(w.state==='installed'&&navigator.serviceWorker.controller)toast('نسخه‌ی نو آمد — باز و بسته کن')});
    });
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloaded)return; reloaded=true; location.reload()});
}
</script>
